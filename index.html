<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoBlog SaaS</title>
    
    <!-- Carrega o Tailwind CSS para o design -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    
    <!-- Carrega o React e ReactDOM diretamente no navegador -->
    <script crossorigin src="[https://unpkg.com/react@18/umd/react.production.min.js](https://unpkg.com/react@18/umd/react.production.min.js)"></script>
    <script crossorigin src="[https://unpkg.com/react-dom@18/umd/react-dom.production.min.js](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)"></script>
    
    <!-- Carrega o Babel para compilar o código na hora -->
    <script src="[https://unpkg.com/@babel/standalone/babel.min.js](https://unpkg.com/@babel/standalone/babel.min.js)"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; }
        /* Suaviza as animações de entrada */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTES DE ÍCONES (Inline SVG) ---
        const IconDashboard = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>;
        const IconRss = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>;
        const IconPen = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>;
        const IconFile = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
        const IconHistory = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>;
        const IconSettings = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconPlus = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconLoader = ({className}) => <svg className={`animate-spin ${className}`} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>;
        const IconSave = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconSend = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;
        const IconClock = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconSparkles = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>;
        const IconCheck = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconAlert = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconMenu = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
        const IconX = ({className}) => <svg className={className} width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

        // --- CÓDIGO PRINCIPAL DA APLICAÇÃO ---
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [notification, setNotification] = useState(null);

            // Configurações do Sistema
            const [settings, setSettings] = useState({
                apiKey: '',           
                aiProvider: 'gemini', 
                gasUrl: '[https://script.google.com/macros/s/AKfycbxaCcrMZ9znYwD74xlWg6DUbTfnCjx8q8Nx1iRahavfiA91PNPzk3pcBzrn9RPQH5VN/exec](https://script.google.com/macros/s/AKfycbxaCcrMZ9znYwD74xlWg6DUbTfnCjx8q8Nx1iRahavfiA91PNPzk3pcBzrn9RPQH5VN/exec)'
            });

            // Dados iniciais
            const [blogs, setBlogs] = useState([
                { id: '1', name: 'Diário de Prontidão', bloggerId: '123456789', url: '[https://diariodeprontidao.blogspot.com/](https://diariodeprontidao.blogspot.com/)', category: 'Geral', status: 'Ativo' }
            ]);
            const [posts, setPosts] = useState([
                { id: '1', title: 'Como iniciar no Marketing Digital', blogName: 'Diário de Prontidão', category: 'Marketing', status: 'Publicado', date: '2026-05-09' },
                { id: '2', title: 'Dicas de SEO para 2026', blogName: 'Diário de Prontidão', category: 'SEO', status: 'Rascunho', date: '2026-05-08' }
            ]);
            const [generatedPost, setGeneratedPost] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Sistema PWA Nativo
            useEffect(() => {
                const manifest = {
                    name: "AutoBlog SaaS",
                    short_name: "AutoBlog",
                    display: "standalone",
                    background_color: "#0f172a",
                    theme_color: "#3b82f6",
                    icons: [{ src: "[https://cdn-icons-png.flaticon.com/512/6062/6062646.png](https://cdn-icons-png.flaticon.com/512/6062/6062646.png)", sizes: "512x512", type: "image/png" }]
                };
                const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
                const manifestUrl = URL.createObjectURL(blob);
                
                let link = document.querySelector('link[rel="manifest"]');
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'manifest';
                    document.head.appendChild(link);
                }
                link.href = manifestUrl;

                let metaTheme = document.querySelector('meta[name="theme-color"]');
                if (!metaTheme) {
                    metaTheme = document.createElement('meta');
                    metaTheme.name = 'theme-color';
                    document.head.appendChild(metaTheme);
                }
                metaTheme.content = '#0f172a';
                
                try {
                    const swCode = `self.addEventListener('install', (e) => self.skipWaiting()); self.addEventListener('fetch', (e) => {});`;
                    const swBlob = new Blob([swCode], { type: 'application/javascript' });
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
                    }
                } catch(e) {}
            }, []);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 6000); // Aumentei o tempo para dar tempo de ler os erros
            };

            return (
                <div className="flex h-screen bg-slate-50 text-slate-800 font-sans flex-col md:flex-row overflow-hidden">
                
                {/* Topbar Mobile */}
                <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center z-20 shadow-md">
                    <div className="flex items-center gap-2">
                        <IconSparkles className="w-5 h-5 text-blue-500" />
                        <h1 className="text-lg font-bold tracking-wide">AutoBlog<span className="text-blue-500">.ai</span></h1>
                    </div>
                    <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-slate-800 rounded-lg">
                        {isMobileMenuOpen ? <IconX className="w-6 h-6" /> : <IconMenu className="w-6 h-6" />}
                    </button>
                </div>

                {/* Overlay Mobile */}
                {isMobileMenuOpen && (
                    <div className="fixed inset-0 bg-black/50 z-30 md:hidden" onClick={() => setIsMobileMenuOpen(false)} />
                )}

                {/* Sidebar Responsiva */}
                <aside className={`fixed inset-y-0 left-0 transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 transition-transform duration-300 ease-in-out z-40 w-64 bg-slate-900 text-slate-300 flex flex-col h-full shadow-2xl md:shadow-none`}>
                    <div className="p-6 hidden md:flex items-center gap-3 border-b border-slate-800">
                    <div className="bg-blue-500 p-2 rounded-lg">
                        <IconSparkles className="w-6 h-6 text-white" />
                    </div>
                    <h1 className="text-xl font-bold text-white tracking-wide">AutoBlog<span className="text-blue-500">.ai</span></h1>
                    </div>
                    
                    <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                        <SidebarItem icon={<IconDashboard className="w-5 h-5"/>} label="Dashboard" isActive={activeTab === 'dashboard'} onClick={() => { setActiveTab('dashboard'); setIsMobileMenuOpen(false); }} />
                        <SidebarItem icon={<IconRss className="w-5 h-5"/>} label="Meus Blogs" isActive={activeTab === 'blogs'} onClick={() => { setActiveTab('blogs'); setIsMobileMenuOpen(false); }} />
                        <SidebarItem icon={<IconPen className="w-5 h-5"/>} label="Criar Post" isActive={activeTab === 'create'} onClick={() => { setActiveTab('create'); setIsMobileMenuOpen(false); }} />
                        {generatedPost && <SidebarItem icon={<IconFile className="w-5 h-5"/>} label="Editor" isActive={activeTab === 'editor'} onClick={() => { setActiveTab('editor'); setIsMobileMenuOpen(false); }} />}
                        <SidebarItem icon={<IconHistory className="w-5 h-5"/>} label="Histórico" isActive={activeTab === 'history'} onClick={() => { setActiveTab('history'); setIsMobileMenuOpen(false); }} />
                        <SidebarItem icon={<IconSettings className="w-5 h-5"/>} label="Configurações" isActive={activeTab === 'settings'} onClick={() => { setActiveTab('settings'); setIsMobileMenuOpen(false); }} />
                    </nav>
                    
                    <div className="p-4 border-t border-slate-800 text-sm">
                        <p>Plano: <span className="text-blue-400 font-semibold">Pro SaaS</span></p>
                        <p className="text-slate-500 mt-1">Status API: <span className="text-green-400">Online</span></p>
                    </div>
                </aside>

                {/* Conteúdo Principal */}
                <main className="flex-1 overflow-y-auto relative w-full">
                    {/* Notificação flutuante */}
                    {notification && (
                    <div className={`absolute top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-all max-w-sm ${notification.type === 'success' ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'}`}>
                        {notification.type === 'success' ? <IconCheck className="w-5 h-5 flex-shrink-0" /> : <IconAlert className="w-5 h-5 flex-shrink-0" />}
                        <p className="font-medium text-sm md:text-base break-words">{notification.message}</p>
                    </div>
                    )}

                    <div className="p-4 md:p-8 max-w-6xl mx-auto pb-20 md:pb-8">
                        {activeTab === 'dashboard' && <Dashboard posts={posts} blogs={blogs} />}
                        {activeTab === 'blogs' && <BlogManager blogs={blogs} setBlogs={setBlogs} showNotification={showNotification} settings={settings} />}
                        {activeTab === 'create' && <PostGenerator blogs={blogs} setGeneratedPost={setGeneratedPost} setActiveTab={setActiveTab} showNotification={showNotification} settings={settings} />}
                        {activeTab === 'editor' && generatedPost && <PostEditor post={generatedPost} setPost={setGeneratedPost} showNotification={showNotification} setActiveTab={setActiveTab} setPosts={setPosts} settings={settings} />}
                        {activeTab === 'history' && <HistoryTab posts={posts} />}
                        {activeTab === 'settings' && <SettingsTab showNotification={showNotification} settings={settings} setSettings={setSettings} />}
                    </div>
                </main>
                </div>
            );
        }

        // --- SUB-COMPONENTES ---

        function Dashboard({ posts, blogs }) {
            const published = posts.filter(p => p.status === 'Publicado').length;
            const drafts = posts.filter(p => p.status === 'Rascunho').length;

            return (
                <div className="fade-in">
                    <h2 className="text-2xl font-bold mb-6 text-slate-800">Visão Geral</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 md:gap-6 mb-8">
                        <StatCard title="Postagens" value={posts.length} icon={<IconFile className="w-6 h-6 text-blue-500" />} />
                        <StatCard title="Publicadas" value={published} icon={<IconSend className="w-6 h-6 text-green-500" />} />
                        <StatCard title="Rascunhos" value={drafts} icon={<IconSave className="w-6 h-6 text-amber-500" />} />
                        <StatCard title="Blogs Ativos" value={blogs.length} icon={<IconRss className="w-6 h-6 text-purple-500" />} />
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6">
                        <h3 className="text-lg font-semibold mb-4 border-b pb-2">Últimas Atividades</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[600px]">
                                <thead>
                                    <tr className="text-sm text-slate-500 border-b">
                                        <th className="pb-3 font-medium">Título</th>
                                        <th className="pb-3 font-medium">Blog</th>
                                        <th className="pb-3 font-medium">Status</th>
                                        <th className="pb-3 font-medium">Data</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {posts.map((post) => (
                                        <tr key={post.id} className="border-b border-slate-50 last:border-0 hover:bg-slate-50 transition-colors">
                                            <td className="py-4 font-medium text-slate-700">{post.title}</td>
                                            <td className="py-4 text-slate-600">{post.blogName}</td>
                                            <td className="py-4">
                                                <span className={`px-3 py-1 rounded-full text-xs font-medium ${post.status === 'Publicado' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>{post.status}</span>
                                            </td>
                                            <td className="py-4 text-slate-500 text-sm">{post.date}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function BlogManager({ blogs, setBlogs, showNotification, settings }) {
            const [showModal, setShowModal] = useState(false);
            const [newBlog, setNewBlog] = useState({ name: '', bloggerId: '', url: '', category: '' });
            const [isSaving, setIsSaving] = useState(false);

            const handleAdd = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const blogData = { ...newBlog, id: Date.now().toString(), status: 'Ativo' };
                
                setBlogs([...blogs, blogData]);
                setShowModal(false);
                setNewBlog({ name: '', bloggerId: '', url: '', category: '' });

                try {
                    showNotification('Sincronizando blog com Google Sheets...', 'success');
                    await fetch(settings.gasUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'addBlog', payload: blogData }) });
                    showNotification('Blog salvo na sua planilha com sucesso!');
                } catch (err) {
                    showNotification('Blog salvo localmente (Erro ao enviar à planilha)', 'error');
                }
                setIsSaving(false);
            };

            return (
                <div className="fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                        <h2 className="text-2xl font-bold text-slate-800">Gerenciar Blogs</h2>
                        <button onClick={() => setShowModal(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors shadow-sm w-full md:w-auto justify-center">
                            <IconPlus className="w-4 h-4" /> Adicionar Blog
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                        {blogs.map(blog => (
                            <div key={blog.id} className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col">
                                <div className="flex justify-between items-start mb-4">
                                    <div className="bg-blue-50 text-blue-600 p-3 rounded-lg"><IconRss className="w-6 h-6" /></div>
                                    <span className="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-medium">{blog.status}</span>
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-1">{blog.name}</h3>
                                <p className="text-sm text-slate-500 mb-4 truncate">{blog.url}</p>
                                <div className="mt-auto space-y-2 text-sm text-slate-600">
                                    <p><strong>ID:</strong> <span className="font-mono">{blog.bloggerId}</span></p>
                                    <p><strong>Categoria:</strong> {blog.category}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl fade-in">
                                <h3 className="text-xl font-bold mb-4">Cadastrar Novo Blog</h3>
                                <form onSubmit={handleAdd} className="space-y-4">
                                    <div><label className="block text-sm font-medium mb-1">Nome do Blog</label><input required type="text" className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" value={newBlog.name} onChange={e => setNewBlog({...newBlog, name: e.target.value})} /></div>
                                    <div><label className="block text-sm font-medium mb-1">ID do Blogger</label><input required type="text" className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono" value={newBlog.bloggerId} onChange={e => setNewBlog({...newBlog, bloggerId: e.target.value})} /></div>
                                    <div><label className="block text-sm font-medium mb-1">URL (Link)</label><input required type="url" className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" value={newBlog.url} onChange={e => setNewBlog({...newBlog, url: e.target.value})} /></div>
                                    <div><label className="block text-sm font-medium mb-1">Categoria Principal</label><input required type="text" className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" value={newBlog.category} onChange={e => setNewBlog({...newBlog, category: e.target.value})} /></div>
                                    <div className="flex gap-3 justify-end mt-6">
                                        <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
                                        <button type="submit" disabled={isSaving} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-md">Salvar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function PostGenerator({ blogs, setGeneratedPost, setActiveTab, showNotification, settings }) {
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({ blogId: blogs[0]?.id || '', theme: '', referenceLink: '', keywords: '', tone: 'Profissional e Engajador', category: '' });

            const handleGenerate = async (e) => {
                e.preventDefault();
                if (!settings.apiKey) {
                    return showNotification('Por favor, configure sua Chave API na aba "Configurações" primeiro.', 'error');
                }
                
                setLoading(true);
                try {
                    const prompt = `Você é um redator profissional especializado em SEO. Crie uma postagem original para blog com base nas seguintes informações: Tema: "${formData.theme}", Categoria: "${formData.category}", Link: "${formData.referenceLink}", Palavras-chave: "${formData.keywords}", Tom: "${formData.tone}". Gere conteúdo HTML limpo (<h2>, <p>, <ul>). Responda APENAS com um objeto JSON válido, sem usar formatação markdown ou blocos de código: {"title": "Título", "content": "HTML...", "seoDescription": "SEO...", "tags": "tags", "suggestedImage": "Prompt"}`;
                    let resultText = "";

                    if (settings.aiProvider === 'gemini') {
                        // Alterado para o modelo 1.5-flash que é o oficial aberto para uso geral
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${settings.apiKey}`, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' }, 
                            body: JSON.stringify({ 
                                contents: [{ parts: [{ text: prompt }] }], 
                                generationConfig: { responseMimeType: "application/json" } 
                            }) 
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error?.message || "Erro desconhecido na API do Gemini.");
                        resultText = data.candidates[0].content.parts[0].text;

                    } else if (settings.aiProvider === 'openai') {
                        const res = await fetch('[https://api.openai.com/v1/chat/completions](https://api.openai.com/v1/chat/completions)', { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.apiKey}` }, 
                            body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: prompt }], response_format: { type: "json_object" } }) 
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error?.message || "Erro desconhecido na API da OpenAI.");
                        resultText = data.choices[0].message.content;

                    } else if (settings.aiProvider === 'groq') {
                        const res = await fetch('[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)', { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.apiKey}` }, 
                            body: JSON.stringify({ model: "llama3-70b-8192", messages: [{ role: "user", content: prompt }], response_format: { type: "json_object" } }) 
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error?.message || "Erro desconhecido na API da Groq.");
                        resultText = data.choices[0].message.content;
                    }

                    // Limpa qualquer sujeira do Markdown que a IA possa ter adicionado (ex: ```json)
                    let cleanJson = resultText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const parsedData = JSON.parse(cleanJson);

                    setGeneratedPost({ ...parsedData, blogId: formData.blogId, blogName: blogs.find(b => b.id === formData.blogId)?.name || 'Blog', category: formData.category });
                    showNotification('Pronto! Revise sua postagem.', 'success');
                    setActiveTab('editor');

                } catch (error) {
                    console.error("LOG DE ERRO DA API:", error);
                    let errorMessage = error.message;
                    if(errorMessage.includes("Failed to fetch") || errorMessage.includes("NetworkError")) {
                        errorMessage = "Acesso bloqueado pela API (Erro de CORS) ou sem conexão de internet. Verifique sua chave ou restrições da conta.";
                    }
                    showNotification('Falha ao gerar postagem: ' + errorMessage, 'error');
                } finally { 
                    setLoading(false); 
                }
            };

            return (
                <div className="max-w-3xl mx-auto fade-in">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-8">
                        <div className="flex items-center gap-3 mb-6 border-b pb-4">
                            <div className="bg-blue-100 p-3 rounded-full hidden md:block"><IconSparkles className="w-6 h-6 text-blue-600" /></div>
                            <div>
                                <h2 className="text-xl md:text-2xl font-bold text-slate-800">Criar Postagem</h2>
                                <p className="text-slate-500 text-xs md:text-sm">A Inteligência Artificial fará o trabalho pesado.</p>
                            </div>
                        </div>
                        <form onSubmit={handleGenerate} className="space-y-4 md:space-y-5">
                            <div><label className="block text-sm font-semibold text-slate-700 mb-1">Selecionar Blog</label><select required className="w-full border rounded-lg p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" value={formData.blogId} onChange={e => setFormData({...formData, blogId: e.target.value})}>{blogs.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}</select></div>
                            <div><label className="block text-sm font-semibold text-slate-700 mb-1">Tema da Postagem *</label><input required type="text" placeholder="Ex: Benefícios da automação" className="w-full border rounded-lg p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" value={formData.theme} onChange={e => setFormData({...formData, theme: e.target.value})} /></div>
                            <div><label className="block text-sm font-semibold text-slate-700 mb-1">Link de Referência (Opcional)</label><input type="url" placeholder="https://..." className="w-full border rounded-lg p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none text-sm" value={formData.referenceLink} onChange={e => setFormData({...formData, referenceLink: e.target.value})} /></div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                                <div><label className="block text-sm font-semibold text-slate-700 mb-1">Palavras-chave (SEO)</label><input type="text" placeholder="seo, negócios..." className="w-full border rounded-lg p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" value={formData.keywords} onChange={e => setFormData({...formData, keywords: e.target.value})} /></div>
                                <div><label className="block text-sm font-semibold text-slate-700 mb-1">Categoria / Marcador</label><input type="text" placeholder="Tecnologia" className="w-full border rounded-lg p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} /></div>
                            </div>
                            <button type="submit" disabled={loading} className={`w-full mt-6 py-4 rounded-xl text-white font-bold md:text-lg flex justify-center items-center gap-3 transition-all shadow-lg ${loading ? 'bg-blue-400' : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700'}`}>
                                {loading ? <><IconLoader className="w-5 h-5" /> Gerando Conteúdo...</> : <><IconSparkles className="w-5 h-5" /> Gerar Postagem Mágica</>}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function PostEditor({ post, setPost, showNotification, setActiveTab, setPosts, settings }) {
            const [isSaving, setIsSaving] = useState(false);

            const handleSave = async (status) => {
                setIsSaving(true);
                const newPost = { id: Date.now().toString(), blogId: post.blogId, title: post.title, blogName: post.blogName, category: post.category, content: post.content, seoDescription: post.seoDescription, tags: post.tags, status: status, date: new Date().toISOString().split('T')[0] };
                setPosts(prev => [newPost, ...prev]);
                setActiveTab('history');

                try {
                    showNotification(`Sincronizando com a Planilha...`, 'success');
                    const action = status === 'Publicado' ? 'publishToBlogger' : 'savePost';
                    await fetch(settings.gasUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, payload: newPost }) });
                    showNotification('Sincronização concluída!');
                } catch (err) {
                    showNotification('Salvo localmente (Erro no Google)', 'error');
                }
                setIsSaving(false);
            };

            return (
                <div className="fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-slate-800">Editor de Postagem</h2>
                            <p className="text-slate-500 text-sm">Blog: <strong>{post.blogName}</strong></p>
                        </div>
                        <div className="flex flex-wrap gap-2 w-full md:w-auto">
                            <button onClick={() => handleSave('Rascunho')} disabled={isSaving} className="flex-1 md:flex-none justify-center flex items-center gap-2 bg-white border border-slate-300 text-slate-700 px-3 md:px-4 py-2 rounded-lg hover:bg-slate-50"><IconSave className="w-4 h-4" /> <span className="hidden md:inline">Salvar Rascunho</span></button>
                            <button onClick={() => handleSave('Publicado')} disabled={isSaving} className="flex-1 md:flex-none justify-center flex items-center gap-2 bg-green-600 text-white px-4 md:px-5 py-2 rounded-lg hover:bg-green-700 font-semibold"><IconSend className="w-4 h-4" /> Publicar <span className="hidden md:inline">no Blogger</span></button>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Título da Postagem</label>
                                <input type="text" className="w-full text-lg md:text-xl font-bold border-b-2 border-transparent hover:border-slate-200 focus:border-blue-500 outline-none py-2 px-1 mb-4" value={post.title} onChange={e => setPost({...post, title: e.target.value})} />
                                <label className="block text-sm font-semibold text-slate-700 mb-2 mt-4">Conteúdo HTML</label>
                                <textarea className="w-full h-[400px] md:h-[500px] border rounded-lg p-3 md:p-4 bg-slate-50 font-mono text-xs md:text-sm focus:ring-2 focus:ring-blue-500 outline-none" value={post.content} onChange={e => setPost({...post, content: e.target.value})} />
                            </div>
                        </div>
                        <div className="space-y-6">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><IconRss className="w-4 h-4 text-blue-500"/> SEO e Metadados</h3>
                                <div className="space-y-4">
                                    <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Descrição</label><textarea className="w-full border rounded-lg p-2 text-sm h-24" value={post.seoDescription} onChange={e => setPost({...post, seoDescription: e.target.value})} /></div>
                                    <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Tags</label><input type="text" className="w-full border rounded-lg p-2 text-sm" value={post.tags} onChange={e => setPost({...post, tags: e.target.value})} /></div>
                                    <div className="pt-4 border-t border-slate-100"><label className="block text-xs font-semibold text-slate-500 uppercase mb-2">Imagem (IA)</label><div className="bg-blue-50 text-blue-800 p-3 rounded-lg text-xs md:text-sm italic">"{post.suggestedImage}"</div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function HistoryTab({ posts }) {
            return (
                <div className="fade-in">
                    <h2 className="text-2xl font-bold mb-6 text-slate-800">Histórico de Postagens</h2>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[800px]">
                                <thead className="bg-slate-50 border-b border-slate-200">
                                    <tr className="text-sm text-slate-600">
                                        <th className="py-4 px-6 font-semibold">Título</th>
                                        <th className="py-4 px-6 font-semibold">Blog</th>
                                        <th className="py-4 px-6 font-semibold">Categoria</th>
                                        <th className="py-4 px-6 font-semibold">Status</th>
                                        <th className="py-4 px-6 font-semibold">Data</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {posts.map((post) => (
                                        <tr key={post.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="py-4 px-6 font-medium text-slate-800">{post.title}</td>
                                            <td className="py-4 px-6 text-slate-600">{post.blogName}</td>
                                            <td className="py-4 px-6 text-slate-600"><span className="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs border border-slate-200">{post.category || 'Geral'}</span></td>
                                            <td className="py-4 px-6"><span className={`px-3 py-1 rounded-full text-xs font-bold ${post.status === 'Publicado' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>{post.status}</span></td>
                                            <td className="py-4 px-6 text-slate-500 text-sm">{post.date}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function SettingsTab({ showNotification, settings, setSettings }) {
            const handleSave = (e) => { e.preventDefault(); showNotification('Configurações atualizadas!'); };
            return (
                <div className="max-w-2xl fade-in">
                    <h2 className="text-2xl font-bold mb-6 text-slate-800">Configurações</h2>
                    <form onSubmit={handleSave} className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-8 space-y-6">
                        <div>
                            <h3 className="text-lg font-semibold border-b pb-2 mb-4 text-slate-800">1. Sua Inteligência Artificial</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Qual IA deseja usar?</label>
                                    <select className="w-full border rounded-lg p-3 bg-slate-50 outline-none" value={settings.aiProvider} onChange={(e) => setSettings({...settings, aiProvider: e.target.value})}>
                                        <option value="gemini">Google Gemini</option><option value="openai">OpenAI (ChatGPT)</option><option value="groq">Groq (Llama 3)</option>
                                    </select>
                                </div>
                                <div><label className="block text-sm font-medium text-slate-700 mb-1">Sua Chave API</label><input type="password" placeholder="Sua API Key..." className="w-full border rounded-lg p-3 bg-slate-50 outline-none font-mono text-sm" value={settings.apiKey} onChange={(e) => setSettings({...settings, apiKey: e.target.value})} /></div>
                            </div>
                        </div>
                        <div>
                            <h3 className="text-lg font-semibold border-b pb-2 mb-4 mt-8 text-slate-800">2. Banco de Dados</h3>
                            <div className="space-y-4">
                                <div><label className="block text-sm font-medium text-slate-700 mb-1">Google Apps Script URL</label><input type="text" className="w-full border rounded-lg p-3 bg-slate-100 text-slate-600 outline-none font-mono text-xs" value={settings.gasUrl} onChange={(e) => setSettings({...settings, gasUrl: e.target.value})} />
                                <p className="text-xs text-green-600 mt-2 flex items-center gap-1"><IconCheck className="w-3 h-3"/> Conectado à planilha.</p></div>
                            </div>
                        </div>
                        <button type="submit" className="w-full md:w-auto bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 shadow-md">Salvar</button>
                    </form>
                </div>
            );
        }

        function SidebarItem({ icon, label, isActive, onClick }) {
            return (
                <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors text-left font-medium ${isActive ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                    <span className={isActive ? 'text-white' : 'text-slate-400'}>{icon}</span>{label}
                </button>
            );
        }

        function StatCard({ title, value, icon }) {
            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center justify-between">
                    <div><p className="text-sm font-medium text-slate-500 mb-1">{title}</p><p className="text-2xl md:text-3xl font-bold text-slate-800">{value}</p></div>
                    <div className="bg-slate-50 p-3 rounded-full border border-slate-100">{icon}</div>
                </div>
            );
        }

        // --- INICIALIZA O REACT ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
